name: Database backup
run-name: Secure Render backup · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake backend and verify database readiness
        run: curl --fail-with-body --show-error --silent --retry 4 --retry-delay 15 --max-time 180 https://mosque-management-admin.onrender.com/healthz
      - name: Create database backup in private Supabase Storage
        env:
          BACKUP_TRIGGER_SECRET: ${{ secrets.BACKUP_TRIGGER_SECRET }}
        run: >-
          curl --fail-with-body --show-error --silent --max-time 300
          --request POST
          --header "Authorization: Bearer ${BACKUP_TRIGGER_SECRET}"
          --header "Accept: application/json"
          https://mosque-management-admin.onrender.com/internal/backups/run
